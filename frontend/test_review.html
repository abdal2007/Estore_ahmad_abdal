<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Product Reviews</title>

<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

<style>
body { font-family: 'Inter', sans-serif; }
</style>
</head>

<body class="bg-gray-50">

<div class="max-w-4xl mx-auto p-6">

    <h1 class="text-3xl font-bold mb-6">Product Reviews</h1>

    <!-- Reviews Container -->
    <div id="reviews-container" class="space-y-4"></div>

    <!-- Pagination -->
    <div id="pagination" class="flex justify-center gap-3 mt-6"></div>

</div>

<script>
const productId = 1; // 🔥 change dynamically
const API_URL = `http://127.0.0.1:8000/products/${productId}/reviews/`;

async function fetchReviews(url = API_URL) {
    try {
        const res = await fetch(url);
        const data = await res.json();

        renderReviews(data.results);
        renderPagination(data);

    } catch (error) {
        console.error("Error:", error);
    }
}

function renderReviews(reviews) {
    const container = document.getElementById("reviews-container");
    container.innerHTML = "";

    if (reviews.length === 0) {
        container.innerHTML = "<p>No reviews found</p>";
        return;
    }

    reviews.forEach(r => {
        container.innerHTML += `
        <div class="bg-white p-4 rounded shadow">
            <h3 class="font-bold text-lg">${r.title}</h3>
            
            <div class="text-yellow-500">
                ${"⭐".repeat(r.rating)}
            </div>

            <p class="text-gray-600 mt-2">${r.comment}</p>

            <small class="text-gray-400">${new Date(r.created_at).toLocaleDateString()}</small>
        </div>
        `;
    });
}

function renderPagination(data) {
    const container = document.getElementById("pagination");
    container.innerHTML = "";

    if (data.previous) {
        container.innerHTML += `
        <button onclick="fetchReviews('${data.previous}')" 
        class="px-4 py-2 bg-gray-200 rounded hover:bg-gray-300">
        Prev
        </button>`;
    }

    if (data.next) {
        container.innerHTML += `
        <button onclick="fetchReviews('${data.next}')" 
        class="px-4 py-2 bg-blue-500 text-white rounded hover:bg-blue-600">
        Next
        </button>`;
    }
}

// Initial load
fetchReviews();
</script>

</body>
</html>
